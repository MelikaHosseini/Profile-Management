{% include "partials/base.html" %}  {% block content %}
<body>
  <div class="container">
    <div class="title">Select a user to delete: </div>
      <div class="form-container">
        {%  for user in users %}
        <div class="input-box">
          {{ user.username }} 
          <span class="details"></span>

          <div class="btn">
          <button class="button" type="submit"> <a href="{% url 'home:deleteByUserName' user.id %}">Delete User</a></button>
        </div>
        </div>
        {% endfor %}
      </div>
    </form>
  </div>
</body>
{% endblock content %}
